<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share zone</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<h1 class="page-title">Share zone</h1>
<input type="file" multiple hidden id="picker">
<button id="drop" type="button"><span class="upload-icon">↑</span><strong>Drop files here</strong><span>or click to choose files</span></button>
<p id="status" role="status" aria-live="polite"></p>
<section class="panel" aria-label="Available files"><div class="list-heading"><h2>Available files</h2><span id="count"></span></div><div id="files"></div><div id="actions" hidden><span id="selected"></span><button id="download">Download</button><button id="delete">Delete</button></div></section>
</main><script src="/static/app.js"></script></body></html>
